<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YARA Rule Builder — write and validate YARA rules in your browser</title>
    <meta
      name="description"
      content="Write YARA rules and see syntax errors as you type, with the line marked in the editor. No install, no signup — paste a rule and get the compiler's answer instantly."
    />

    <!-- Open Graph: controls how the link renders when shared. Update og:url
         to the real domain once it's deployed, and add og:image when you
         have a screenshot — a card without an image gets far fewer clicks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YARA Rule Builder" />
    <meta property="og:title" content="YARA Rule Builder" />
    <meta
      property="og:description"
      content="Write YARA rules and see syntax errors as you type, with the line marked in the editor."
    />
    <meta property="og:url" content="https://example.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YARA Rule Builder" />
    <meta
      name="twitter:description"
      content="Write YARA rules and see syntax errors as you type, with the line marked in the editor."
    />

    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
